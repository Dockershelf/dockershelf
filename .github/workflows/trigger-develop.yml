name: Trigger (develop branch)

on:
  workflow_dispatch:
    inputs:
      debian:
        description: Build debian images
        type: boolean
        default: true
      latex:
        description: Build latex images
        type: boolean
        default: true
      python:
        description: Build python images
        type: boolean
        default: true
      node:
        description: Build node images
        type: boolean
        default: true
      go:
        description: Build go images
        type: boolean
        default: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - docker-image-name: "dockershelf/debian:bookworm"
            docker-image-extra-tags: "dockershelf/debian:oldstable"
            debian-suite: "oldstable"
          - docker-image-name: "dockershelf/debian:trixie"
            docker-image-extra-tags: "dockershelf/debian:stable"
            debian-suite: "stable"
          - docker-image-name: "dockershelf/debian:forky"
            docker-image-extra-tags: "dockershelf/debian:testing"
            debian-suite: "testing"
          - docker-image-name: "dockershelf/debian:sid"
            docker-image-extra-tags: "dockershelf/debian:unstable dockershelf/debian:latest"
            debian-suite: "unstable"
          - docker-image-name: "dockershelf/latex:basic"
            docker-image-extra-tags: "dockershelf/latex:basic-stable dockershelf/latex:latest-stable dockershelf/latex:latest"
          - docker-image-name: "dockershelf/latex:full"
            docker-image-extra-tags: "dockershelf/latex:full-stable"
          - docker-image-name: "dockershelf/latex:extras"
            docker-image-extra-tags: "dockershelf/latex:extras-stable"
          - docker-image-name: "dockershelf/python:3.10-trixie"
            docker-image-extra-tags: "dockershelf/python:3.10-stable"
          - docker-image-name: "dockershelf/python:3.10-sid"
            docker-image-extra-tags: "dockershelf/python:3.10-unstable dockershelf/python:3.10"
          - docker-image-name: "dockershelf/python:3.11-trixie"
            docker-image-extra-tags: "dockershelf/python:3.11-stable"
          - docker-image-name: "dockershelf/python:3.11-sid"
            docker-image-extra-tags: "dockershelf/python:3.11-unstable dockershelf/python:3.11"
          - docker-image-name: "dockershelf/python:3.12-trixie"
            docker-image-extra-tags: "dockershelf/python:3.12-stable"
          - docker-image-name: "dockershelf/python:3.12-sid"
            docker-image-extra-tags: "dockershelf/python:3.12-unstable dockershelf/python:3.12"
          - docker-image-name: "dockershelf/python:3.13-trixie"
            docker-image-extra-tags: "dockershelf/python:3.13-stable"
          - docker-image-name: "dockershelf/python:3.13-sid"
            docker-image-extra-tags: "dockershelf/python:3.13-unstable dockershelf/python:3.13"
          - docker-image-name: "dockershelf/python:3.14-trixie"
            docker-image-extra-tags: "dockershelf/python:3.14-stable dockershelf/python:3-stable dockershelf/python:3-trixie dockershelf/python:latest-stable dockershelf/python:latest-trixie"
          - docker-image-name: "dockershelf/python:3.14-sid"
            docker-image-extra-tags: "dockershelf/python:3.14-unstable dockershelf/python:3.14 dockershelf/python:3-unstable dockershelf/python:3-sid dockershelf/python:3 dockershelf/python:latest-unstable dockershelf/python:latest-sid dockershelf/python:latest"
          - docker-image-name: "dockershelf/node:16-trixie"
            docker-image-extra-tags: "dockershelf/node:16-stable"
          - docker-image-name: "dockershelf/node:16-sid"
            docker-image-extra-tags: "dockershelf/node:16-unstable dockershelf/node:16"
          - docker-image-name: "dockershelf/node:18-trixie"
            docker-image-extra-tags: "dockershelf/node:18-stable"
          - docker-image-name: "dockershelf/node:18-sid"
            docker-image-extra-tags: "dockershelf/node:18-unstable dockershelf/node:18"
          - docker-image-name: "dockershelf/node:20-trixie"
            docker-image-extra-tags: "dockershelf/node:20-stable"
          - docker-image-name: "dockershelf/node:20-sid"
            docker-image-extra-tags: "dockershelf/node:20-unstable dockershelf/node:20"
          - docker-image-name: "dockershelf/node:22-trixie"
            docker-image-extra-tags: "dockershelf/node:22-stable"
          - docker-image-name: "dockershelf/node:22-sid"
            docker-image-extra-tags: "dockershelf/node:22-unstable dockershelf/node:22"
          - docker-image-name: "dockershelf/node:24-trixie"
            docker-image-extra-tags: "dockershelf/node:24-stable dockershelf/node:latest-stable dockershelf/node:latest-trixie"
          - docker-image-name: "dockershelf/node:24-sid"
            docker-image-extra-tags: "dockershelf/node:24-unstable dockershelf/node:24 dockershelf/node:latest-unstable dockershelf/node:latest-sid dockershelf/node:latest"
          - docker-image-name: "dockershelf/go:1.22-trixie"
            docker-image-extra-tags: "dockershelf/go:1.22-stable"
          - docker-image-name: "dockershelf/go:1.22-sid"
            docker-image-extra-tags: "dockershelf/go:1.22-unstable dockershelf/go:1.22"
          - docker-image-name: "dockershelf/go:1.23-trixie"
            docker-image-extra-tags: "dockershelf/go:1.23-stable"
          - docker-image-name: "dockershelf/go:1.23-sid"
            docker-image-extra-tags: "dockershelf/go:1.23-unstable dockershelf/go:1.23"
          - docker-image-name: "dockershelf/go:1.24-trixie"
            docker-image-extra-tags: "dockershelf/go:1.24-stable"
          - docker-image-name: "dockershelf/go:1.24-sid"
            docker-image-extra-tags: "dockershelf/go:1.24-unstable dockershelf/go:1.24"
          - docker-image-name: "dockershelf/go:1.25-trixie"
            docker-image-extra-tags: "dockershelf/go:1.25-stable"
          - docker-image-name: "dockershelf/go:1.25-sid"
            docker-image-extra-tags: "dockershelf/go:1.25-unstable dockershelf/go:1.25"
          - docker-image-name: "dockershelf/go:1.26-trixie"
            docker-image-extra-tags: "dockershelf/go:1.26-stable dockershelf/go:latest-stable dockershelf/go:latest-trixie"
          - docker-image-name: "dockershelf/go:1.26-sid"
            docker-image-extra-tags: "dockershelf/go:1.26-unstable dockershelf/go:1.26 dockershelf/go:latest-unstable dockershelf/go:latest-sid dockershelf/go:latest"

    steps:
      # matrix is unavailable in job-level if; filter per step instead
      - name: Checkout repo
        if: >
          (startsWith(matrix.docker-image-name, 'dockershelf/debian:') && inputs.debian) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/latex:') && inputs.latex) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/python:') && inputs.python) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/node:') && inputs.node) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/go:') && inputs.go)
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up QEMU
        if: >
          (startsWith(matrix.docker-image-name, 'dockershelf/debian:') && inputs.debian) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/latex:') && inputs.latex) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/python:') && inputs.python) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/node:') && inputs.node) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/go:') && inputs.go)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: >
          (startsWith(matrix.docker-image-name, 'dockershelf/debian:') && inputs.debian) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/latex:') && inputs.latex) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/python:') && inputs.python) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/node:') && inputs.node) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/go:') && inputs.go)
        uses: docker/setup-buildx-action@v4

      - if: >
          (startsWith(matrix.docker-image-name, 'dockershelf/debian:') && inputs.debian) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/latex:') && inputs.latex) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/python:') && inputs.python) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/node:') && inputs.node) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/go:') && inputs.go)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Building docker image
        if: >
          (startsWith(matrix.docker-image-name, 'dockershelf/debian:') && inputs.debian) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/latex:') && inputs.latex) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/python:') && inputs.python) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/node:') && inputs.node) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/go:') && inputs.go)
        env:
          DOCKER_IMAGE_NAME: ${{ matrix.docker-image-name }}
          DEBIAN_SUITE: ${{ matrix.debian-suite }}
          DH_USERNAME: ${{ secrets.DH_USERNAME }}
          DH_PASSWORD: ${{ secrets.DH_PASSWORD }}
        run: |
          bash build-image.sh "${DOCKER_IMAGE_NAME}" "${DEBIAN_SUITE}" "${DH_USERNAME}" "${DH_PASSWORD}" "develop"

      - name: Testing docker image
        if: >
          (startsWith(matrix.docker-image-name, 'dockershelf/debian:') && inputs.debian) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/latex:') && inputs.latex) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/python:') && inputs.python) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/node:') && inputs.node) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/go:') && inputs.go)
        env:
          DOCKER_IMAGE_NAME: ${{ matrix.docker-image-name }}
          DOCKER_IMAGE_EXTRA_TAGS: ${{ matrix.docker-image-extra-tags }}
        run: |
          bash test-image.sh "${DOCKER_IMAGE_NAME}" "develop"

      - name: Pushing docker image
        if: >
          (startsWith(matrix.docker-image-name, 'dockershelf/debian:') && inputs.debian) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/latex:') && inputs.latex) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/python:') && inputs.python) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/node:') && inputs.node) ||
          (startsWith(matrix.docker-image-name, 'dockershelf/go:') && inputs.go)
        env:
          DOCKER_IMAGE_NAME: ${{ matrix.docker-image-name }}
          DOCKER_IMAGE_EXTRA_TAGS: ${{ matrix.docker-image-extra-tags }}
          DH_USERNAME: ${{ secrets.DH_USERNAME }}
          DH_PASSWORD: ${{ secrets.DH_PASSWORD }}
        run: |
          bash push-image.sh "${DOCKER_IMAGE_NAME}" "${DH_USERNAME}" "${DH_PASSWORD}" "${DOCKER_IMAGE_EXTRA_TAGS}" "develop"
