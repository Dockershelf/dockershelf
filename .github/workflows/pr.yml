name: Pull Request

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened
    branches:
      - develop

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - python-version: "3.9"
            toxenv: "py39"
          - python-version: "3.10"
            toxenv: "py310"
          - python-version: "3.11"
            toxenv: "py311"
          - python-version: "3.12"
            toxenv: "py312"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installing dependencies
        run: |
          sudo apt-get install -y libxml2-dev libxslt-dev
          python3 -m pip install -r requirements.txt

      - name: Functional test
        env:
          TOXENV: ${{ matrix.toxenv }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python3 update.py

  # >>> rosey-maintainer:ci-quality BEGIN
  code-quality:
    name: Code Quality
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Semgrep scan
        run: |
          BASELINE="${{ github.event.pull_request.base.sha }}"
          semgrep scan \
            --config p/ci \
            --config p/python \
            --baseline-commit "${BASELINE}" \
            --metrics=off \
            --error
  # <<< rosey-maintainer:ci-quality END
