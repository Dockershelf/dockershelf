name: Push

on:
  push:
    branches:
      - develop
      - master
      - "release/**"

jobs:
  production-build:
    name: Production Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set environment variables
        run: |
          echo "UID=$(id -u)" >> $GITHUB_ENV
          echo "GID=$(id -g)" >> $GITHUB_ENV
          echo "PROJECT_NAME=dockershelf" >> $GITHUB_ENV

      - name: Prepare CI environment file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Docker image
        run: make image

      - name: Install dependencies in container
        run: make dependencies

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Debian images need RUN --security=insecure (debootstrap mounts /proc)
          buildkitd-flags: --allow-insecure-entitlement security.insecure

      - name: Build production artifacts
        run: make build

      - name: Tear down Docker
        if: always()
        run: make down

  release-gate:
    name: Release Gate
    runs-on: ubuntu-24.04
    needs: [production-build]
    steps:
      - name: Confirm all release checks passed
        run: |
          echo "Release gate passed for ${{ github.ref_name }}"
